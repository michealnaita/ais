[project]
name = "ais-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "michealnaita", email = "michealnaita@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.142.1",
    "mammoth>=1.13.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.1.1",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
